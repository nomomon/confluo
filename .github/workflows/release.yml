name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Check tag matches Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1; }
      - name: Import signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/devid-g2.cer"
          security import "$RUNNER_TEMP/devid-g2.cer" -k "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build, sign, notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/release-macos.sh
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Confluo $v" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/Confluo-$v.dmg" "dist/Confluo-$v-macos.zip" dist/SHA256SUMS
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  linux:
    # After the macOS job has created the release; adds Linux assets and their checksums.
    needs: release
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4.2.2
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y $(cat packaging/linux/build-deps.txt) file
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Build
        run: cargo build --release -p gv-desktop
      - name: Package
        run: cargo install cargo-deb --locked && scripts/package-linux.sh
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.AppImage *.deb *.tar.gz > "SHA256SUMS-linux-$(uname -m)"
          gh release upload "$GITHUB_REF_NAME" *.AppImage *.deb *.tar.gz "SHA256SUMS-linux-$(uname -m)"

  checksums:
    # One SHA256SUMS for every asset (the updater reads it), merged after both Linux uploads.
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - name: Merge SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -p 'SHA256SUMS*'
          cat SHA256SUMS SHA256SUMS-linux-* | sort -u -k2 > merged
          mv merged SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          for f in SHA256SUMS-linux-*; do gh release delete-asset "$GITHUB_REF_NAME" "$f" -y; done
